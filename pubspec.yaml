name: breaklog
description: "BreakLog — a personal bboy move log"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  google_sign_in: ^7.2.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  package_info_plus: ^10.2.1
  http: ^1.2.2
  google_fonts: ^6.3.3
  intl: ^0.20.0
  url_launcher: ^6.3.1
  image_picker: ^1.2.1
  record: ^6.2.1
  path_provider: ^2.1.5
  flutter_local_notifications: ^22.3.2
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  video_player: ^2.11.1
  # Decode clips with libmpv instead of the device MediaCodec, so hardware
  # decoders that reject a stream (odd dimensions, High profile) are bypassed.
  video_player_media_kit: ^2.0.0
  media_kit_libs_android_video: ^1.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
